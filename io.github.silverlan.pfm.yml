    - install -Dm755 ${FLATPAK_ID}.prad.sh -t /app/bin
    - install -Dm755 ${FLATPAK_ID}.pragma.sh -t /app/bin
    - install -Dm755 ${FLATPAK_ID}.pragma_server.sh -t /app/bin
    - install -Dm755 ${FLATPAK_ID}.render_raytracing.sh -t /app/bin
