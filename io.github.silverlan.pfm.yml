app-id: io.github.silverlan.pfm
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk

command: io.github.silverlan.pfm.sh

build-options:
  # make sure strip is disabled
  strip: false
  # disable debug‑info extraction so symbols stay in the main binaries
  no-debuginfo: true

modules:
  - name: cmake
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-linux-x86_64.tar.gz
        sha256: '5bb505d5e0cca0480a330f7f27ccf52c2b8b5214c5bba97df08899f5ef650c23'
        strip-components: 0
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/usr
      - cp -r cmake-4.2.3-linux-x86_64/bin cmake-4.2.3-linux-x86_64/share ${FLATPAK_DEST}/usr/
      - chmod -R a+rX ${FLATPAK_DEST}/usr/bin ${FLATPAK_DEST}/usr/share
      - rm -rf cmake-4.2.3-linux-x86_64

  - name: clang
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0-rc1/LLVM-22.1.0-rc1-Linux-X64.tar.xz
        sha256: 'e6007fb39e502293eeccde21d7e16f9c9d1fbfaf2dd3ccaefe2b7987c2b52657'
        strip-components: 0
    build-commands:
      - |
        chmod -R a+rX LLVM-22.1.0-rc1-Linux-X64/bin
        targetRoot=${FLATPAK_DEST}
        mkdir -p ${targetRoot}/build_tools
        mv LLVM-22.1.0-rc1-Linux-X64 ${targetRoot}/build_tools/clang
      
  - name: gcc
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/Silverlan/gcc_prebuilt/releases/download/c3fa37ceeb5-releases-gcc-15/gcc-15.2.1-releases-gcc-15.tar.xz
        sha256: 'df5a22907bd814c8cbc5770b5c1cc2ddd9f83ca4f7bf667d4387c8295e91da00'
        strip-components: 0
    build-commands:
      - |
        targetRoot=${FLATPAK_DEST}
        mkdir -p ${targetRoot}/build_tools
        cp -r gcc ${targetRoot}/build_tools/
        chmod -R a+rX ${targetRoot}/build_tools/gcc/bin
        cat > "${targetRoot}/build_tools/gcc/version.json" <<'EOF'
        {
          "version": "c3fa37ceeb5-releases-gcc-15"
        }
        EOF
        rm -rf gcc-15.2.1-releases-gcc-15.tar.xz
        echo "Extracted gcc to ${targetRoot}/build_tools/gcc/"

  - name: third-party-deps
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/Silverlan/pragma-deps-lib/releases/download/2026-01-19/lib-linux-x64-clang.tar.gz
        sha256: '9d590391b9ac40c338640cdf11517926be8d47e06820e63c2b7acdd94b9207a0'
        dest: deps/staging
    build-commands:
      - |
        targetRoot=${FLATPAK_DEST}
        mkdir -p ${targetRoot}/deps/staging
        tar -xzf deps/staging/lib-linux-x64-clang.tar.gz -C ${targetRoot}/deps/staging
        cat > "${targetRoot}/deps/staging/version.json" <<'EOF'
        {
          "version": "2026-01-19-clang"
        }
        EOF
        rm -f deps/staging/lib-linux-x64-clang.tar.gz
        echo "Extracted deps to ${targetRoot}/deps/staging/"

